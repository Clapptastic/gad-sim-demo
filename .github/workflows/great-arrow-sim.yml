name: great-arrow-sim
run-name: great-arrow-sim ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      nonce: { required: true, type: string }
      seeds: { required: true, type: string }
      budget_ms: { required: true, type: string }
      cmd: { required: true, type: string }
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm ci; fi
      - name: Seed sweep
        env:
          SIM_SEEDS: ${{ inputs.seeds }}
          SIM_BUDGET_MS: ${{ inputs.budget_ms }}
          SIM_CMD: ${{ inputs.cmd }}
        run: node .great-arrow/sim.mjs --seeds "$SIM_SEEDS" --budget-ms "$SIM_BUDGET_MS" --cmd "$SIM_CMD"
